[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-agent"
version = "0.1.0"
description = "Agentic COBOL knowledge graph builder using Claude API"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.39.0",
    "click>=8.1",
    "pydantic>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.12"]

[project.scripts]
cobol-agent = "cobol_agent.cli:main"

[tool.setuptools.packages.find]
include = ["cobol_agent*"]
